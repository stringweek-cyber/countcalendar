<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f8">
<title>회차 달력</title>
<style>
:root{
  --bg:#f7f7f8;--card:#fff;--ink:#18181b;--sub:#8a8a93;--line:#ececef;--soft:#f2f2f4;
  --brand:#18181b;--brand-soft:#f2f2f4;
  --red:#e5484d;--red-soft:#fdf0f0;--orange:#d9730d;--orange-soft:#fdf5ec;
  --green:#2f9e6b;--green-soft:#eef8f2;--sun:#e5484d;--sat:#3b6ff5;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;letter-spacing:-.2px;padding-bottom:calc(48px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;letter-spacing:inherit}
input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
