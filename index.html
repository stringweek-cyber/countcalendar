<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f8">
<title>회차 달력</title>
<style>
:root{
  --bg:#f7f7f8;--card:#fff;--ink:#18181b;--sub:#8a8a93;--line:#ececef;--soft:#f2f2f4;
  --brand:#18181b;--brand-soft:#f2f2f4;
  --red:#e5484d;--red-soft:#fdf0f0;--orange:#d9730d;--orange-soft:#fdf5ec;
  --green:#2f9e6b;--green-soft:#eef8f2;--sun:#e5484d;--sat:#3b6ff5;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;letter-spacing:-.2px;padding-bottom:calc(48px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;letter-spacing:inherit}
input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 16px}
header h1{font-size:19px;font-weight:700;letter-spacing:-.5px}
header h1 span{color:var(--sub);font-weight:500}
.icon-btn{height:32px;padding:0 13px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-size:13px;font-weight:600}

#alerts:empty{display:none}
#alerts{margin-bottom:12px;display:flex;flex-direction:column;gap:6px}
.alert{padding:11px 14px;border-radius:12px;font-size:13.5px;display:flex;gap:10px;align-items:baseline;line-height:1.5;background:var(--card);box-shadow:var(--shadow)}
.alert::before{content:"";width:6px;height:6px;border-radius:50%;flex:none;align-self:center}
.alert.red{color:var(--ink)}.alert.red::before{background:var(--red)}
.alert.orange{color:var(--ink)}.alert.orange::before{background:var(--orange)}
.alert b{font-weight:700;flex:none}
.alert.red b{color:var(--red)}.alert.orange b{color:var(--orange)}

.cal{background:var(--card);border-radius:20px;padding:14px 10px 12px;box-shadow:var(--shadow)}
.cal-head{display:flex;align-items:center;justify-content:center;gap:18px;padding:2px 0 14px}
.cal-head .ym{font-size:17px;font-weight:700;min-width:118px;text-align:center;font-variant-numeric:tabular-nums}
.cal-head button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--sub);transition:background .15s}
.cal-head button:hover,.cal-head button:active{background:var(--soft);color:var(--ink)}
.cal-head svg{width:18px;height:18px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11.5px;color:var(--sub);padding-bottom:8px;font-weight:500}
.wk div:first-child{color:var(--sun)}.wk div:last-child{color:var(--sat)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line)}
.cell{min-height:80px;padding:6px 2px 4px;display:flex;flex-direction:column;gap:2px;overflow:hidden;cursor:pointer;border-bottom:1px solid var(--line);text-align:left;transition:background .12s}
.cell:active,.cell:hover{background:#fafafb}
.cell.out .dn,.cell.out .chip{opacity:.35}
.cell .dn{font-size:12px;font-weight:500;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;margin:0 auto 2px;font-variant-numeric:tabular-nums}
.cell.sun .dn{color:var(--sun)}.cell.sat .dn{color:var(--sat)}
.cell.today .dn{background:var(--ink);color:#fff;font-weight:700}
.chip{font-size:10.5px;line-height:1.5;border-radius:4px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:clip;font-weight:600;background:color-mix(in srgb,var(--c) 13%,#fff);color:var(--c)}
.chip.pay{background:var(--red-soft)!important;color:var(--red)}
.chip.pay.done{background:var(--green-soft)!important;color:var(--green)}
.chip b{font-weight:800}
.more{font-size:10px;color:var(--sub);padding:0 4px}

.sec-title{display:flex;align-items:center;justify-content:space-between;margin:28px 4px 12px}
.sec-title h2{font-size:15px;font-weight:700}
.btn{height:40px;padding:0 16px;border-radius:12px;font-weight:600;font-size:14px;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:4px;transition:opacity .15s}
.btn:active{opacity:.75}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.soft{background:var(--soft);color:var(--ink)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:10px}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border-radius:16px;padding:14px 16px 14px 34px;position:relative;box-shadow:var(--shadow)}
.card .bar{position:absolute;left:16px;top:21px;width:8px;height:8px;border-radius:50%}
.card .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.card .nm{font-size:15.5px;font-weight:700}
.card .meta{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.card .st{margin-top:8px;font-size:13px;font-weight:500;color:var(--sub)}
.card .st.red{color:var(--red);font-weight:600}
.card .st.orange{color:var(--orange);font-weight:600}
.card .acts{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.empty{text-align:center;color:var(--sub);font-size:13.5px;padding:30px 12px;background:var(--card);border-radius:16px;line-height:1.75;box-shadow:var(--shadow)}
.foot{display:flex;gap:6px;justify-content:center;margin-top:32px;flex-wrap:wrap}
.foot .btn.ghost{background:transparent;box-shadow:none;color:var(--sub);font-weight:500}
.foot .note{width:100%;text-align:center;font-size:11.5px;color:var(--sub);margin-top:2px}

.ov{position:fixed;inset:0;background:rgba(20,20,24,.32);display:none;align-items:flex-end;justify-content:center;z-index:50;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.ov.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 18px calc(20px + env(safe-area-inset-bottom));animation:up .2s cubic-bezier(.2,.8,.2,1)}
@media(min-width:620px){.ov{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-size:17px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.sheet h3 button{font-size:20px;color:var(--sub);width:32px;height:32px;border-radius:50%;background:var(--soft);line-height:1}
.lbl{font-size:12.5px;font-weight:600;color:var(--sub);margin:16px 0 7px}
.lbl small{font-weight:400}
.inp{width:100%;height:44px;border:0;border-radius:12px;padding:0 14px;background:var(--soft);font-size:15px;outline:none;transition:box-shadow .15s}
.inp:focus{box-shadow:inset 0 0 0 1.5px var(--ink);background:#fff}
.row{display:flex;gap:10px;align-items:flex-start}
.row>*{flex:1}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border-radius:9px;font-size:13px;font-weight:600;color:var(--sub);padding:5px}
.seg button small{font-weight:400}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.hint{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.6}
.ent{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:var(--soft);margin-bottom:6px;font-size:14px}
.ent .dot{width:8px;height:8px;border-radius:50%;flex:none}
.ent .tx{flex:1;min-width:0}
.ent .x{color:var(--sub);font-size:12.5px;padding:5px 10px;border-radius:8px;background:#fff;flex:none}
.ent .pt{font-size:12px;font-weight:600;padding:5px 10px;border-radius:8px;flex:none;background:#fff;color:var(--red);box-shadow:inset 0 0 0 1px #f5c2c4}
.ent .pt.done{color:var(--green);box-shadow:inset 0 0 0 1px #bfe3cf}
.addgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.addbtn{min-height:58px;border-radius:14px;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);box-shadow:none;font-weight:700;font-size:15px;padding:9px 12px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px;position:relative;transition:box-shadow .15s}
.addbtn:active{box-shadow:inset 0 0 0 1.5px var(--c)}
.addbtn small{font-weight:500;font-size:12px;color:var(--c);opacity:.75}
.btns{display:flex;gap:8px;margin-top:20px}
.btns .btn{flex:1;height:48px}
.divider{height:1px;background:var(--line);margin:16px 0 4px}

.dlg{background:#fff;border-radius:20px;padding:22px 18px 16px;width:calc(100% - 40px);max-width:340px;align-self:center;animation:up .18s ease-out}
.dlg p{font-size:15px;line-height:1.6;white-space:pre-line}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:rgba(24,24,27,.94);color:#fff;padding:11px 16px;border-radius:14px;font-size:13.5px;opacity:0;pointer-events:none;transition:.22s;z-index:80;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{color:#9ec5ff;font-weight:600;flex:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>회차 <span>달력</span></h1>
    <button class="icon-btn" id="todayBtn" title="오늘">오늘</button>
  </header>

  <div id="alerts"></div>

  <section class="cal">
    <div class="cal-head">
      <button id="prev" aria-label="이전 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="ym" id="ym"></div>
      <button id="next" aria-label="다음 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    <div class="wk"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div class="grid" id="grid"></div>
  </section>

  <div class="sec-title">
    <h2>등록한 수업</h2>
    <button class="btn sm" id="addItem">+ 수업 등록</button>
  </div>
  <div class="list" id="list"></div>

  <div class="foot">
    <button class="btn ghost sm" id="exportBtn">백업 내보내기</button>
    <button class="btn ghost sm" id="importBtn">백업 불러오기</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
    <div class="note">기록은 이 기기·이 브라우저에만 저장됩니다. 기기를 바꿀 땐 백업 파일을 이용하세요.</div>
  </div>
</div>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="ov" id="dlgOv" style="z-index:70"><div class="dlg" id="dlg"></div></div>
<div id="toast"></div>

<script>
/* ===== 저장 ===== */
const KEY='hoecha-calendar-v2';
const COLORS=['#5b6cf0','#0f9ba8','#2f9e6b','#d9730d','#d6457a','#8b5cf6','#e5484d','#5f6b7a'];
const WD=['일','월','화','수','목','금','토'];
let db=load();
const now=new Date();
let view={y:now.getFullYear(),m:now.getMonth()};

function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY));
    if(d&&Array.isArray(d.items))return{items:d.items,sessions:d.sessions||[]};
  }catch(e){}
  return{items:[],sessions:[]};
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db));}
  catch(e){toast('저장에 실패했어요. 브라우저 저장공간을 확인하세요.');}
}

/* ===== 유틸 ===== */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c);};
const todayStr=()=>ymd(new Date());
const fmt=s=>{const d=parse(s);return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`;};
const fmtLong=s=>{const d=parse(s);return `${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`;};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const item=id=>db.items.find(x=>x.id===id);
const byDate=(a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.at||0)-(b.at||0);
const sessOf=id=>db.sessions.filter(s=>s.iid===id).sort(byDate);
const startNo=it=>Math.max(1,parseInt(it.start)||1);
const cycleOf=it=>Math.max(0,parseInt(it.cycle)||0);

/* N회차가 수업료 내는 회차인지 */
function isPayNo(it,n){
  const c=cycleOf(it);if(!c)return false;
  return it.payAt==='first'?(n-1)%c===0:n%c===0;
}
/* 회차 번호를 붙인 기록 목록 — 수업료를 내면(냄 ✓) 다시 1회부터 */
function numbered(it){
  const c=cycleOf(it),first=it.payAt==='first';
  let n=startNo(it)-1;
  return sessOf(it.id).map(s=>{
    if(c&&first&&s.paid&&isPayNo(it,n+1))n=0;   // 첫 회차 방식: 낸 날이 1회
    n++;
    const o={...s,no:n,pay:isPayNo(it,n)};
    if(c&&!first&&s.paid&&o.pay)n=0;             // 마지막 회차 방식: 낸 다음 수업이 1회
    return o;
  });
}
/* 날짜 d에 추가하면 몇 회차가 되는지 (같은 날 기록 뒤에 붙음) */
function noIfAdded(it,d){
  const list=numbered(it).filter(s=>s.date<=d);
  if(!list.length)return startNo(it);
  const L=list[list.length-1];
  return (cycleOf(it)&&it.payAt!=='first'&&L.paid&&L.pay)?1:L.no+1;
}
function info(it){
  const list=numbered(it);
  const last=list.length?list[list.length-1].no:startNo(it)-1;
  const unpaid=list.filter(s=>s.pay&&!s.paid);
  const nextNo=noIfAdded(it,'9999-12-31');
  let nextPay=null;
  if(cycleOf(it))for(let n=nextNo;n<=nextNo+cycleOf(it);n++)if(isPayNo(it,n)){nextPay=n;break;}
  return{list,last,nextNo,count:list.length,unpaid,nextPay,remain:nextPay?nextPay-nextNo+1:null,
    lastDate:list.length?list[list.length-1].date:null};
}

/* ===== 렌더 ===== */
function render(){renderAlerts();renderCal();renderList();}

function renderAlerts(){
  const el=document.getElementById('alerts');
  const red=[],orange=[];
  db.items.forEach(it=>{
    const f=info(it);
    f.unpaid.forEach(s=>red.push(`${it.name} ${s.no}회차(${fmt(s.date)})`));
    if(f.remain===1)orange.push(`${it.name} 다음 수업(${f.nextPay}회차)`);
  });
  let h='';
  if(red.length)h+=`<div class="alert red"><b>수업료 낼 차례</b><span>${esc(red.join(', '))}</span></div>`;
  if(orange.length)h+=`<div class="alert orange"><b>다음에 수업료</b><span>${esc(orange.join(', '))}</span></div>`;
  el.innerHTML=h;
}

function renderCal(){
  document.getElementById('ym').textContent=`${view.y}년 ${view.m+1}월`;
  const first=new Date(view.y,view.m,1);
  const start=new Date(view.y,view.m,1-first.getDay());
  const days=[];
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);days.push(ymd(d));}
  const T=todayStr();
  const ev={};
  db.items.forEach(it=>numbered(it).forEach(s=>{(ev[s.date]=ev[s.date]||[]).push({it,s});}));
  let h='';
  days.forEach(d=>{
    const dt=parse(d);
    const cls=['cell'];
    if(dt.getMonth()!==view.m)cls.push('out');
    if(d===T)cls.push('today');
    if(dt.getDay()===0)cls.push('sun');if(dt.getDay()===6)cls.push('sat');
    const list=ev[d]||[];
    let chips='';
    list.slice(0,3).forEach(({it,s})=>{
      const pc=s.pay?(s.paid?' pay done':' pay'):'';
      chips+=`<div class="chip${pc}" style="--c:${it.color}"><b>${s.pay?'₩':''}${s.no}</b> ${esc(it.name)}</div>`;
    });
    if(list.length>3)chips+=`<div class="more">+${list.length-3}</div>`;
    h+=`<button class="${cls.join(' ')}" data-d="${d}"><span class="dn">${dt.getDate()}</span>${chips}</button>`;
  });
  const g=document.getElementById('grid');
  g.innerHTML=h;
  g.querySelectorAll('.cell').forEach(c=>c.onclick=()=>openDay(c.dataset.d));
}

function renderList(){
  const el=document.getElementById('list');
  if(!db.items.length){
    el.innerHTML=`<div class="empty">먼저 ‘+ 수업 등록’에서 수학과외, 영어과외처럼<br>기록할 수업을 등록하세요.<br>그다음 달력 날짜를 눌러 수업을 고르면 회차가 자동으로 붙어요.</div>`;
    return;
  }
  el.innerHTML=db.items.map(it=>{
    const f=info(it);
    let st='',cls='';
    if(f.unpaid.length){
      cls='red';st=`수업료 내야 함: ${f.unpaid.map(s=>`${s.no}회차(${fmt(s.date)})`).join(', ')}`;
    }else if(f.nextPay){
      const when=it.payAt==='first'?'수업 때':'수업 날';
      if(f.remain===1){cls='orange';st=`다음 수업(${f.nextPay}회차) ${when} 수업료`;}
      else st=`다음 수업료: ${f.nextPay}회차 ${when} · ${f.remain}회 남음`;
    }
    return `<div class="card">
      <div class="bar" style="background:${it.color}"></div>
      <div class="top"><div class="nm">${esc(it.name)}</div><div class="meta">${f.count?`${f.last}회차까지 · 최근 ${fmt(f.lastDate)}`:'아직 기록 없음'}</div></div>
      ${st?`<div class="st ${cls}">${esc(st)}</div>`:''}
      <div class="acts">
        <button class="btn soft sm" data-a="add" data-id="${it.id}">+ 오늘 ${noIfAdded(it,todayStr())}회</button>
        <button class="btn ghost sm" data-a="edit" data-id="${it.id}">설정</button>
      </div></div>`;
  }).join('');
  el.querySelectorAll('[data-a]').forEach(b=>{
    const id=b.dataset.id;
    if(b.dataset.a==='add')b.onclick=()=>addWithToast(id,todayStr());
    if(b.dataset.a==='edit')b.onclick=()=>openItem(id);
  });
}

/* ===== 기록 ===== */
async function addWithToast(iid,d,after){
  const it=item(iid);
  if(db.sessions.some(s=>s.iid===iid&&s.date===d)){
    if(!await ask(`${fmt(d)}에 이미 ${it.name} 기록이 있어요.\n한 번 더 추가할까요?`,'추가'))return;
  }
  const no=noIfAdded(it,d);
  const o={id:uid(),iid,date:d,at:Date.now(),paid:false};
  db.sessions.push(o);save();render();if(after)after();
  toast(`${it.name} ${no}회 기록${isPayNo(it,no)?' · 수업료 내는 날':''}`,()=>{
    db.sessions=db.sessions.filter(x=>x.id!==o.id);save();render();if(after)after();
  });
}

/* ===== 날짜 시트 ===== */
let curDay=null;
function openDay(d){curDay=d;drawDay();openSheet();}
function drawDay(){
  const d=curDay;
  const sh=document.getElementById('sheet');
  let ents='';
  db.items.forEach(it=>numbered(it).filter(s=>s.date===d).forEach(s=>{
    ents+=`<div class="ent"><span class="dot" style="background:${it.color}"></span>
      <div class="tx"><b>${esc(it.name)}</b> ${s.no}회</div>
      ${s.pay?`<button class="pt${s.paid?' done':''}" data-paid="${s.id}">${s.paid?'수업료 냄 ✓':'수업료 안 냄 (누르면 냄)'}</button>`:''}
      <button class="x" data-del="${s.id}">삭제</button></div>`;
  }));
  let add;
  if(!db.items.length){
    add=`<div class="empty">등록된 수업이 없어요.</div><div class="btns"><button class="btn" id="goAdd">+ 수업 등록</button></div>`;
  }else{
    add=`<div class="lbl">눌러서 수업 추가</div><div class="addgrid">${db.items.map(it=>{
      const no=noIfAdded(it,d);
      return `<button class="addbtn" data-add="${it.id}" style="--c:${it.color}"><span style="display:flex;align-items:center;gap:7px"><i style="width:8px;height:8px;border-radius:50%;background:${it.color};flex:none"></i>${esc(it.name)}</span><small>${no}회${isPayNo(it,no)?' · 수업료 내는 날':''}</small></button>`;
    }).join('')}</div>`;
  }
  sh.innerHTML=`<h3>${fmtLong(d)}<button id="cls">×</button></h3>
    ${ents||'<div class="hint" style="margin:0 0 4px">이 날의 기록이 없어요.</div>'}
    ${ents?'<div class="divider"></div>':''}${add}`;
  sh.querySelector('#cls').onclick=closeSheet;
  sh.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{let once=true;addWithToast(b.dataset.add,d,()=>{if(once){once=false;closeSheet();}});});
  sh.querySelectorAll('[data-paid]').forEach(b=>b.onclick=()=>{
    const s=db.sessions.find(x=>x.id===b.dataset.paid);if(!s)return;
    s.paid=!s.paid;save();render();drawDay();
  });
  sh.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(!await ask('이 기록을 삭제할까요?\n이후 회차 번호는 자동으로 다시 매겨져요.','삭제'))return;
    db.sessions=db.sessions.filter(x=>x.id!==b.dataset.del);save();render();drawDay();
  });
  const ga=sh.querySelector('#goAdd');if(ga)ga.onclick=()=>openItem(null);
}

/* ===== 수업 등록/설정 ===== */
function openItem(id){
  const ex=id?item(id):null;
  const f=ex?{...ex}:{name:'',color:COLORS[db.items.length%COLORS.length],start:1,cycle:'',payAt:'last'};
  drawItem(f,ex);openSheet();
}
function drawItem(f,ex){
  const sh=document.getElementById('sheet');
  sh.innerHTML=`<h3>${ex?'수업 설정':'수업 등록'}<button id="cls">×</button></h3>
    <div class="lbl">수업 이름</div>
    <input class="inp" id="fName" value="${esc(f.name)}" placeholder="예: 수학과외, 영어과외, 상담" maxlength="20">
    <div class="lbl">색상</div>
    <div class="chips">${COLORS.map(c=>`<button class="sw${c===f.color?' on':''}" data-c="${c}" style="background:${c}"></button>`).join('')}</div>
    <div class="row">
      <div><div class="lbl">시작 회차</div><input class="inp" id="fStart" type="number" inputmode="numeric" min="1" value="${esc(f.start)}"></div>
      <div><div class="lbl">수업료 주기 <small>(회)</small></div><input class="inp" id="fCycle" type="number" inputmode="numeric" min="0" value="${esc(f.cycle)}" placeholder="안 씀"></div>
    </div>
    <div class="hint">시작 회차: 이미 진행한 수업이 있으면 다음 회차 번호를 넣으세요. (처음이면 1)<br>수업료 주기: 예) 1번 내고 8회 수업하면 8. 비워두면 수업료 표시를 하지 않아요.</div>
    <div class="lbl">수업료 내는 날</div>
    <div class="seg" id="segPay">
      <button data-v="last" class="${f.payAt!=='first'?'on':''}">주기 마지막 회차<br><small>8·16·24회</small></button>
      <button data-v="first" class="${f.payAt==='first'?'on':''}">주기 첫 회차<br><small>1·9·17회</small></button>
    </div>
    <div class="btns">
      ${ex?'<button class="btn danger" id="fDel" style="flex:.5">삭제</button>':''}
      <button class="btn" id="fSave">저장</button>
    </div>`;
  const grab=()=>{
    f.name=sh.querySelector('#fName').value;
    f.start=sh.querySelector('#fStart').value;
    f.cycle=sh.querySelector('#fCycle').value;
  };
  sh.querySelector('#cls').onclick=closeSheet;
  sh.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{grab();f.color=b.dataset.c;drawItem(f,ex);});
  sh.querySelectorAll('#segPay button').forEach(b=>b.onclick=()=>{grab();f.payAt=b.dataset.v;drawItem(f,ex);});
  sh.querySelector('#fSave').onclick=()=>{
    grab();
    const name=f.name.trim();
    if(!name){toast('수업 이름을 입력하세요');return;}
    const data={name,color:f.color,start:startNo(f),cycle:cycleOf(f),payAt:f.payAt==='first'?'first':'last'};
    if(ex)Object.assign(ex,data);else db.items.push({id:uid(),...data});
    save();render();
    closeSheet();toast(ex?'저장했어요':`${name} 등록됨 · 달력 날짜를 눌러 추가하세요`);
  };
  const del=sh.querySelector('#fDel');
  if(del)del.onclick=async()=>{
    const n=db.sessions.filter(s=>s.iid===ex.id).length;
    if(!await ask(`${ex.name}을(를) 삭제할까요?${n?`\n기록 ${n}개도 함께 삭제됩니다.`:''}`,'삭제'))return;
    db.items=db.items.filter(x=>x.id!==ex.id);
    db.sessions=db.sessions.filter(s=>s.iid!==ex.id);
    save();render();closeSheet();toast('삭제했어요');
  };
}

/* ===== 시트/확인창/토스트 ===== */
const ov=document.getElementById('ov');
function openSheet(){ov.classList.add('show');document.body.style.overflow='hidden';}
function closeSheet(){ov.classList.remove('show');document.body.style.overflow='';}
ov.addEventListener('click',e=>{if(e.target===ov)closeSheet();});

function ask(msg,okLabel='확인'){
  return new Promise(res=>{
    const o=document.getElementById('dlgOv'),d=document.getElementById('dlg');
    d.innerHTML=`<p>${esc(msg)}</p><div class="btns"><button class="btn ghost" id="dN">취소</button><button class="btn${okLabel==='삭제'?' danger':''}" id="dY">${esc(okLabel)}</button></div>`;
    o.classList.add('show');
    const done=v=>{o.classList.remove('show');res(v);};
    d.querySelector('#dN').onclick=()=>done(false);
    d.querySelector('#dY').onclick=()=>done(true);
    o.onclick=e=>{if(e.target===o)done(false);};
  });
}
let tt;
function toast(msg,undo){
  const t=document.getElementById('toast');
  t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button id="undo">되돌리기</button>':''}`;
  t.classList.add('show');
  if(undo)t.querySelector('#undo').onclick=()=>{undo();t.classList.remove('show');};
  clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),undo?4500:2200);
}

/* ===== 백업 ===== */
document.getElementById('exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify({app:'hoecha-calendar',version:2,exportedAt:new Date().toISOString(),...db},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`회차달력_백업_${todayStr().replace(/-/g,'')}.json`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('백업 파일을 저장했어요');
};
document.getElementById('importBtn').onclick=()=>document.getElementById('fileIn').click();
document.getElementById('fileIn').onchange=async e=>{
  const file=e.target.files[0];e.target.value='';
  if(!file)return;
  try{
    const text=(await file.text()).replace(/[​-‍﻿]/g,'');
    const d=JSON.parse(text);
    if(!d||!Array.isArray(d.items))throw 0;
    if(!await ask(`백업을 불러오면 현재 기록이 모두 바뀝니다.\n(수업 ${d.items.length}개, 기록 ${(d.sessions||[]).length}개)`,'불러오기'))return;
    db={items:d.items,sessions:d.sessions||[]};
    save();render();toast('백업을 불러왔어요');
  }catch(err){toast('올바른 백업 파일이 아니에요');}
};

/* ===== 이벤트 ===== */
document.getElementById('prev').onclick=()=>{view.m--;if(view.m<0){view.m=11;view.y--;}renderCal();};
document.getElementById('next').onclick=()=>{view.m++;if(view.m>11){view.m=0;view.y++;}renderCal();};
document.getElementById('todayBtn').onclick=()=>{const t=new Date();view={y:t.getFullYear(),m:t.getMonth()};renderCal();};
document.getElementById('addItem').onclick=()=>openItem(null);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render();});

render();
</script>
</body>
</html>
